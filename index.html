<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07070c">
  <title>vizzualizer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='14' width='5' height='15' rx='2' fill='%2360a5fa'/%3E%3Crect x='10' y='6' width='5' height='23' rx='2' fill='%23a78bfa'/%3E%3Crect x='17' y='10' width='5' height='19' rx='2' fill='%23f472b6'/%3E%3Crect x='24' y='18' width='5' height='11' rx='2' fill='%23fb923c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="viz" aria-hidden="true"></canvas>

  <!-- empty state / drop target -->
  <section id="dropzone" class="dropzone">
    <div class="drop-inner">
      <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <h1>vizzualizer</h1>
      <p>drop audio files or a whole folder here</p>
      <div class="drop-actions">
        <button id="pickFiles" class="btn primary" type="button">pick files</button>
        <button id="pickFolder" class="btn" type="button">pick a folder</button>
      </div>
      <p class="hint">mp3 · flac · ogg · opus · m4a · aac · wav · aiff — nothing leaves your browser</p>
    </div>
  </section>
  <input type="file" id="fileInput" accept="audio/*,.mp3,.flac,.ogg,.oga,.opus,.m4a,.m4b,.mp4,.aac,.wav,.aif,.aiff,.aifc,.webm,.weba,.mka,.mp2" multiple hidden>
  <input type="file" id="folderInput" webkitdirectory directory multiple hidden>

  <!-- top: now playing + corner icons -->
  <header class="topbar">
    <div class="now-playing" id="nowPlaying" hidden>
      <div class="np-title" id="npTitle"></div>
      <div class="np-sub" id="npSub"></div>
    </div>
    <div class="corner">
      <button id="listBtn" class="icon-btn" type="button" title="playlist (l)" aria-label="playlist" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <button id="infoBtn" class="icon-btn" type="button" title="track info (i)" aria-label="track info" aria-expanded="false" aria-controls="infoPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 11v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.3" fill="currentColor"/></svg>
      </button>
    </div>
    <div id="infoPanel" class="info-panel" role="dialog" aria-label="track info" hidden>
      <div class="info-empty">nothing playing yet</div>
    </div>
  </header>

  <!-- playlist drawer -->
  <aside id="playlist" class="playlist" aria-label="playlist" hidden>
    <div class="pl-head">
      <span id="plCount" class="pl-count">0 tracks</span>
      <div class="pl-actions">
        <button id="addMore" class="text-btn" type="button">+ add</button>
        <button id="clearList" class="text-btn" type="button">clear</button>
        <button id="closeList" class="icon-btn small" type="button" aria-label="close playlist">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <ol id="plItems" class="pl-items"></ol>
  </aside>

  <!-- bottom controls -->
  <footer class="controls" id="controls" hidden>
    <div class="seek-row">
      <span id="tCur" class="time">0:00</span>
      <input type="range" id="seek" class="seek" min="0" max="1000" value="0" step="1" aria-label="seek">
      <span id="tDur" class="time">0:00</span>
    </div>
    <div class="ctl-row">
      <div class="ctl-left">
        <button id="shuffleBtn" class="icon-btn" type="button" title="shuffle (s)" aria-label="shuffle" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 4l4 4-4 4M4 8h5c3 0 4 1.5 5.5 4s2.5 4 5.5 4h1M4 16h5c1.2 0 2.1-.2 2.8-.7M16 12l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <button id="repeatBtn" class="icon-btn" type="button" title="repeat (r)" aria-label="repeat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l4 4-4 4M21 7H8a4 4 0 0 0-4 4v1M7 21l-4-4 4-4M3 17h13a4 4 0 0 0 4-4v-1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <span id="repeatBadge" class="badge" hidden>1</span>
        </button>
      </div>
      <div class="ctl-center">
        <button id="prevBtn" class="icon-btn" type="button" title="previous (p)" aria-label="previous">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5l-10 7 10 7z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </button>
        <button id="playBtn" class="icon-btn play" type="button" title="play/pause (space)" aria-label="play">
          <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>
          <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>
        </button>
        <button id="nextBtn" class="icon-btn" type="button" title="next (n)" aria-label="next">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l10 7-10 7z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="ctl-right">
        <div class="modes" id="modes" role="group" aria-label="visualizer mode">
          <button type="button" data-mode="bars" class="active">bars</button>
          <button type="button" data-mode="wave">wave</button>
          <button type="button" data-mode="ring">ring</button>
          <button type="button" data-mode="particles">dust</button>
        </div>
        <button id="muteBtn" class="icon-btn" type="button" title="mute (m)" aria-label="mute">
          <svg class="ic-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
          <svg class="ic-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <input type="range" id="volume" class="volume" min="0" max="1" step="0.01" value="0.8" aria-label="volume">
        <button id="fsBtn" class="icon-btn" type="button" title="fullscreen (f)" aria-label="fullscreen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="dragOverlay" class="drag-overlay" hidden><div>drop to add</div></div>

  <script src="js/metadata.js"></script>
  <script src="js/player.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
